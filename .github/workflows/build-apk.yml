name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Generar www/index.html
        run: bash build.sh

      - name: Preparar iconos
        run: |
          mkdir -p resources
          cp icon-only.png icon-foreground.png icon-background.png splash.png resources/

      - name: Crear proyecto Android (solo la primera vez)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Icono y pantalla de inicio
        run: npm run assets

      - name: Pantalla apaisada en la tablet
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's|android:name="\.MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          fi
          grep -q 'sensorLandscape' "$MANIFEST"

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mtiny-retos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
